# sudo docker compose --env-file .env.development up -d
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: darts-server
    restart: unless-stopped
    env_file:
      - .env.development
    environment:
      NODE_ENV: development
      PORT: ${BACKEND_PORT:-3000}
      POSTGRES_HOST: postgres
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-darts}:${MONGO_INITDB_ROOT_PASSWORD:-darts}@mongodb:${MONGO_PORT:-27017}/${MONGO_INITDB_DATABASE:-darts}?authSource=admin
      REDIS_URL: redis://redis:6379
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    command: sh -c "npm install --legacy-peer-deps && npm run start:dev"
    working_dir: /app
    volumes:
      - ./server:/app
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: darts-web
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      VITE_BACKEND_URL: http://server:3000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    working_dir: /app
    volumes:
      - ./web:/app
    ports:
      - '${FRONTEND_PORT:-5173}:5173'
    depends_on:
      server:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: darts-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-darts} -d ${POSTGRES_DB:-darts}']
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: darts-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-darts}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-darts}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-darts}
    ports:
      - '${MONGODB_PORT:-27017}:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --username ${MONGO_INITDB_ROOT_USERNAME:-darts} --password ${MONGO_INITDB_ROOT_PASSWORD:-darts} --authenticationDatabase admin --eval "db.adminCommand({ ping: 1 })" --quiet']
      interval: 15s
      timeout: 10s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: darts-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
